name: TAVARES Bot - Auditoria semanal
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * 1'
permissions:
  contents: write
concurrency:
  group: tavares-auditoria
  cancel-in-progress: false
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auditar repositorios publicos
        env:
          GITHUB_OWNER: cincoregioes-star
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/auditar.py
      - name: Validar resultados
        run: |
          python -m json.tool data/auditoria.json > /dev/null
          test -s data/RELATORIO.md
      - name: Salvar relatorios no repositorio do TAVARES Bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/auditoria.json data/RELATORIO.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualizar auditoria publica TAVARES Bot'
            git push
          fi
